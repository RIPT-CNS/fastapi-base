# One stack for dev and prod: every difference lives in .env
#   docker compose up -d --build
name: ${COMPOSE_PROJECT_NAME:-fastapi-base}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: ${APP_IMAGE:-fastapi-base}:${APP_TAG:-latest}
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
  volumes:
    - .:/app
  # Lets the containers reach services on the host (e.g. a local Keycloak) via host.docker.internal
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging: *logging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # One-shot: alembic upgrade head + create the first admin, then exits
  migrate:
    <<: *app
    command: ["python", "-m", "app.cli", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000${API_PREFIX:-/api}/health-check', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pg_data:
